name: Build Speech-to-Phrase image

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the version tag already exists"
        type: boolean
        default: false

concurrency:
  group: build-speech-to-phrase
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: OHF-Voice/apps
  UPSTREAM_DIR: speech-to-phrase
  UPSTREAM_REF: main
  BUNDLE_MODEL: ""   # empty = lean image, models download at first start

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Check out upstream (add-on folder only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          sparse-checkout: ${{ env.UPSTREAM_DIR }}
          path: upstream

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read upstream version and check for existing tag
        id: v
        working-directory: upstream
        env:
          FORCE: ${{ inputs.force }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' "$UPSTREAM_DIR/config.yaml" | head -1 | tr -d "\"'\r ")"
          if ! [[ "$version" =~ ^[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Could not read a valid version from config.yaml (got '$version')" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            build=false
            echo "$IMAGE:$version already exists, nothing to do."
          else
            build=true
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            ha_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            ha_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out upstream at the checked commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: ${{ env.UPSTREAM_DIR }}
          path: upstream

      - name: Resolve base image from upstream build.yaml
        id: base
        run: |
          from="$(awk -v a="${{ matrix.ha_arch }}:" '$1==a {print $2}' "upstream/$UPSTREAM_DIR/build.yaml" | tr -d "\"'\r")"
          if [ -z "$from" ]; then
            echo "No base image for ${{ matrix.ha_arch }} in build.yaml" >&2
            exit 1
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: upstream/${{ env.UPSTREAM_DIR }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.from }}
            BUNDLE_MODEL=${{ env.BUNDLE_MODEL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "Expected 2 digests (amd64 + arm64)" >&2; ls; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect result
        run: docker buildx imagetools inspect "${IMAGE}:${{ needs.check.outputs.version }}"
